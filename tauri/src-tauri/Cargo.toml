[package]
name = "hmsi"
version = "0.1.0"
description = "Hospital Management System - Windows desktop wrapper"
edition = "2021"
authors = ["HMSI"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "hmsi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]