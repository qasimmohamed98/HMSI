# Q VIREXA — virexa.qproductshub.tech
# الواجهة ملفات ثابتة من web/dist، و/api يُمرَّر إلى خادم Node على 127.0.0.1:8787.
# certbot يضيف HTTPS وتحويل HTTP تلقائياً (deploy/README-hostinger.md).
server {
    listen 80;
    listen [::]:80;
    server_name virexa.qproductshub.tech;

    root /opt/hmsi/app/web/dist;
    index index.html;

    # المرفقات والشعار (الحد الأعلى للمرفق في النظام أقل من هذا)
    client_max_body_size 20m;

    # نفس رؤوس الأمان التي كانت في netlify.toml
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-src 'self' blob:; media-src 'self' blob:; form-action 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # يُستبدل (لا يُضاف) حتى لا يزوّر العميل عنوانه ويتجاوز حماية محاولات الدخول
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ملفات البناء تحمل بصمة في اسمها — تُخزَّن سنة
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # الـ Service Worker يُفحص في كل زيارة ليصل التحديث فوراً
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # تطبيق صفحة واحدة: كل المسارات الأخرى إلى index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
