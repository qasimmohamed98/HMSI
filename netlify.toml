# ⚠ النظام انتقل إلى Hostinger: https://virexa.qproductshub.tech (deploy/README-hostinger.md)
# هذا الموقع على Netlify يبقى فقط لتحويل الزوار القدامى:
# - sw.js يمسح النسخة المحفوظة لدى من فتح النظام سابقاً وينقله للعنوان الجديد
# - كل المسارات الأخرى (ومنها /api) تحويل دائم 301
# الدوال معطّلة عمداً (لا API ولا نسخ مجدولة على Turso بعد الآن).

[build]
  command = "echo 'moved to Hostinger'"
  publish = "netlify/moved"

[functions]
  # مجلد غير موجود = لا دوال (المجلد الافتراضي netlify/functions كان سيُنشر لو حُذف هذا السطر)
  directory = "netlify/disabled-functions"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/sw.js"
  to = "/sw.js"
  status = 200

[[redirects]]
  from = "/*"
  to = "https://virexa.qproductshub.tech/:splat"
  status = 301
  force = true
