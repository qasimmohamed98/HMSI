[build]
  command = "npm run build"
  publish = "web/dist"

  [build.environment]
    NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# SPA fallback (stays after static files & API function)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200